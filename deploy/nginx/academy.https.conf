# Install only after Certbot has issued the academy certificate.
server {
    listen 80;
    listen [::]:80;
    server_name academy.novaceptai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://academy.novaceptai.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name academy.novaceptai.com;

    ssl_certificate /etc/letsencrypt/live/academy.novaceptai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.novaceptai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/novaai-academy;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }

    access_log /var/log/nginx/academy.access.log;
    error_log /var/log/nginx/academy.error.log;
}
