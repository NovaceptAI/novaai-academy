# Bootstrap configuration: install before requesting the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name academy.novaceptai.com;

    root /var/www/novaai-academy;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }

    access_log /var/log/nginx/academy.access.log;
    error_log /var/log/nginx/academy.error.log;
}
